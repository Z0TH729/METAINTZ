<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="METAINTZ - Public File Metadata Intelligence Tool">
  <title>METAINTZ</title>
</head>
<body>
  <header>
    <h1>METAINTZ</h1>
    <p>Public File Metadata Intelligence Tool</p>
  </header>

  <main>
    <section aria-labelledby="status-heading">
      <h2 id="status-heading">API status</h2>
      <p id="api-status" role="status">Checking API...</p>
      <button id="check-api" type="button">Check connection</button>
    </section>

    <section aria-labelledby="scope-heading">
      <h2 id="scope-heading">Inspection scope</h2>
      <p>Use METAINTZ only with files and domains you own or are explicitly authorized to assess.</p>
    </section>
  </main>

  <script src="./js/app.js" defer></script>
</body>
</html>
